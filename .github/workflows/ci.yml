name: CI

# Memeriksa setiap push dan pull request: analisis kode dan uji Flutter.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analisis & uji)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Pasang dependensi
        run: flutter pub get

      - name: Analisis kode
        run: flutter analyze

      - name: Jalankan uji
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Belum ada uji."
          fi
